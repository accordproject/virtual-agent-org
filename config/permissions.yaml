# What each agent may do directly, and which critical actions it may REQUEST.
#
# Rule of the network: agents never hold credentials for critical actions.
# Critical actions go through the `request_action` custom tool, which the
# gateway queues for the owner and executes with its own scoped credentials.
#
# mcp_servers: external tools the agent can call itself. Any MCP tool that
#   writes externally is always_ask as a backstop.
# requestable: action kinds the agent may put in the decision queue.

# Decisions at or below this risk can also be approved from Discord DMs
# (decision 15B). High-risk decisions and paused tool calls stay Telegram-only.
# One of: none, low, medium. Never high.
discord_approval_max_risk: medium

# Where approval cards go. discord: cards you can approve in Discord go only to
# Discord (Telegram keeps high-risk cards and paused tool calls). telegram: Telegram
# only. both: every Discord-approvable card in both apps.
approvals_app: discord

# Decision 2A: Mira's merge proposals must come from a fresh review-check session,
# never from the session that wrote the review. Whatever this says, the gateway checks
# every github.merge itself before queuing it and again before running it (decision 35).
review_check_required: true

action_kinds:
  github.merge:        { risk: medium, executor: github }
  github.close:        { risk: low,    executor: github }
  github.comment:      { risk: low,    executor: github }   # public comment as the project bot
  github.release:      { risk: high,   executor: github }
  # Approves "waiting for approval" CI runs on a fork PR after the agent's risk review.
  # auto: runs without Matt, but the gateway itself refuses (and queues for Matt
  # instead) any PR that touches workflows, build scripts or dependency files.
  github.approve_ci:   { risk: low,    executor: github, auto: true }
  # Posts a review check's confirmed findings as one comment-only review (decision 36).
  # auto: no card. Only submit_review creates it, after the gateway checks the findings
  # against the PR and refuses text that @mentions anyone but the author or talks about
  # the agent network. Never requestable through request_action.
  github.review:       { risk: low,    executor: github, auto: true }
  # Opens a PR updating AGENTS.md, CONTRIBUTING.md, REVIEWING.md or CLAUDE.md. The PR
  # then needs a maintainer's review like any other.
  github.docs_pr:      { risk: medium, executor: github }
  vimeo.publish:       { risk: medium, executor: vimeo }    # title, description and (if asked) make public
  wordpress.publish:   { risk: medium, executor: manual }
  linkedin.post:       { risk: medium, executor: manual }   # decision 8: drafts go to Telegram, owner posts
  discord.announce:    { risk: medium, executor: discord }  # the bot posts to channels.announcements (config/discord.yaml)
  discord.ops:         { risk: low,    executor: discord_ops }  # the bot posts to channels.agent_ops; may ping people in people.yaml
  message.person:      { risk: medium, executor: discord_dm }  # DM to people in people.yaml (payload.to: GitHub logins or names); manual if they have no Discord id
  email.send:          { risk: high,   executor: manual }
  spec.change:         { risk: low,    executor: task }     # the mechanic opens a PR in virtual-agent-org; the gateway raises risk by change type
  other:               { risk: high,   executor: manual }

agents:
  ada:
    # No external tools at all. Internal tools only (see gateway custom tools), plus
    # file tools for her own memory store (decision 40).
    mcp_servers: []
    builtin_tools: [read, write, edit, glob]
    requestable: [spec.change, other, discord.ops]
  mira:
    mcp_servers:
      github: { mode: read_plus_triage }   # read, label, assign, request review via her own GitHub App
    builtin_tools: [read, write, edit, glob, web_fetch]
    requestable: [github.merge, github.close, github.comment, github.release, github.approve_ci, github.docs_pr, discord.ops]
  vera:
    mcp_servers:
      github: { mode: read }
    builtin_tools: [read, write, edit, glob, bash, web_fetch]       # bash for computing metrics in her sandbox
    requestable: []
  otto:
    mcp_servers:
      vimeo:  { mode: read }
      github: { mode: read }
    builtin_tools: [read, write, edit, glob, web_fetch]
    requestable: [vimeo.publish, discord.announce, github.comment, message.person, discord.ops]
  mechanic:
    # No credentials: the gateway pushes the branch and opens the PR (decision 51).
    mcp_servers: []
    builtin_tools: [read, write, edit, glob, bash]
    requestable: []
  rosa:
    mcp_servers:
      github: { mode: read_plus_triage }
    builtin_tools: [read, write, edit, glob, web_fetch]
    requestable: [github.comment, discord.announce, message.person]
  juno:
    mcp_servers:
      github: { mode: read }
      wordpress: { mode: draft_only }
    builtin_tools: [read, write, edit, glob, web_fetch]
    requestable: [wordpress.publish, linkedin.post, github.comment]
  sage:
    mcp_servers: {}
    builtin_tools: [read, write, edit, glob, web_search, web_fetch]
    requestable: []
  kit:
    mcp_servers:
      github: { mode: read }
    builtin_tools: [read, write, edit, glob, bash, web_fetch, web_search]
    requestable: [github.comment, other, discord.ops]
  felix:
    mcp_servers:
      github: { mode: read }
    builtin_tools: [read, write, edit, glob, bash, web_fetch]
    requestable: [github.release, github.comment]
  nell:
    mcp_servers: {}
    builtin_tools: [read, write, edit, glob, web_search, web_fetch]
    requestable: [email.send, message.person]
