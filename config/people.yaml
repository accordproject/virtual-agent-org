# People who can reach the network, and who they are on each platform.
#
# Owner rights (approve, pause, stop, revoke) come ONLY from the
# OWNER_TELEGRAM_ID Worker secret. Nothing in this file can grant them:
# anyone listed here, whatever their role, gets read-and-ask access
# (ask Ada, /status, /queue) on the platforms where their id matches.
#
# Roles (one, or a list such as `role: [tsc_member, maintainer]`):
#   owner        Matt (owner rights still come only from the secret above)
#   tsc_member   Technical Steering Committee member
#   maintainer   reviews and merges; add `maintains: [concerto, template-engine]`
#                to say where, so Mira requests their review on those repos
#
# Ids:
#   telegram: numeric user id (message the bot, then /whoami)
#   discord:  numeric user id, quoted (Discord settings → Advanced → Developer Mode,
#             then right-click the person → Copy User ID). Used from Phase 2.
#   github:   login, for matching people across PRs, Discord and Telegram
