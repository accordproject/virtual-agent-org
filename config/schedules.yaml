# Recurring work. Most runs as Managed Agents scheduled deployments; see task: below.
# Times are wall-clock Europe/London; avoid 01:00-03:00 (DST skips/duplicates).
# budget_usd is a per-run cap: the session pauses when it is reached.
# task names one of the agent's tasks in models.yaml, whose tier and effort the run uses;
# without it the run uses the agent's default tier and effort. A schedule with a task is
# run by the gateway's cron, not as a Managed Agents deployment: deployments accept only a
# plain agent reference, so they can't change the model (decision 67).

schedules:
  - name: ada-checkin
    agent: ada
    cron: "30 7 */2 * *"        # every other day, 07:30
    budget_usd: 1.50
    prompt: >
      Run the check-in. Ask each active agent for status with get_status, read the latest
      scorecard, and list decisions. First work through "Following up" in your instructions:
      assign each blocked task, failed decision and task idle more than 4 days to an agent
      who can fix it, or put it to Matt as a decision, never twice for the same id. Then send
      Matt one check-in message with send_to_matt in the standard format, with the
      follow-ups and any new change results listed.

  - name: ada-weekly-evaluation
    agent: ada
    cron: "0 16 * * 5"          # Fridays 16:00
    task: evaluation            # models.yaml: Ada's tier and effort for this run
    budget_usd: 3.00
    prompt: >
      Run the weekly evaluation for every active agent, reading the rubric first as your
      instructions say.
      Record each evaluation with record_evaluation and raise at most one spec.change
      request per agent, following "Proposing a change" in your instructions.

  - name: ada-weekly-update
    agent: ada
    cron: "0 16 * * 2"          # Tuesdays 16:00: the deck is in hand before Wednesday's Tech WG (13:00 London)
    task: weekly_update         # models.yaml
    budget_usd: 2.00
    prompt: >
      Write and send this week's weekly update deck, following "Weekly update" in your
      instructions.

  - name: mira-triage
    agent: mira
    cron: "0 8 * * *"           # daily; the gateway adds passes when PRs or issues are opened (network.yaml triage_checks)
    task: triage
    budget_usd: 1.00
    prompt: >
      Triage pass: first-respond to every new PR and issue, label and route, request
      reviewers, approve CI for reviewed fork PRs, nudge, and propose closures. Record the
      outcomes of posted findings and reviewed PRs. Do not review code in this pass.

  - name: mira-review
    agent: mira
    cron: "0 10 * * 1-5"        # weekdays; GitHub wakes do most reviews (decision 62)
    task: review
    budget_usd: 3.00
    prompt: >
      Review pass, catching up on what GitHub wakes missed: review up to three PRs in
      pr_queue order, skipping any marked review_woken_at_head, following "Reviewing a PR" in your
      instructions, and hand each draft to request_review_check.

  - name: mira-lessons
    agent: mira
    cron: "0 14 * * 5"          # Fridays 14:00, before Ada's evaluation
    budget_usd: 1.50
    prompt: >
      Lessons pass: turn the last month of review_findings, and the last week's maintainer
      review comments on merged or closed PRs, into review lessons and, where a lesson is
      ready, propose an update to that repo's AGENTS.md with github.docs_pr.

  - name: vera-daily
    agent: vera
    cron: "0 6 * * *"
    budget_usd: 0.50
    prompt: >
      Refresh KPIs and agent cost, write the daily scorecard, and flag anomalies.

  - name: vera-weekly
    agent: vera
    cron: "0 14 * * 5"          # before Ada's evaluation
    task: analysis
    budget_usd: 1.50
    prompt: >
      Build the weekly scorecard per agent: KPIs, decision outcomes, spend and cost per
      outcome, the evidence section and the change results.

  - name: otto-tech-wg
    agent: otto
    cron: "0 9 * * 1"           # Mondays: agenda and news candidates; announce last week's meeting
    budget_usd: 1.00
    prompt: >
      Prepare this week's Tech WG agenda and news candidates, and announce last week's meeting if
      its recording is approved, following "Monday" in your instructions.

  - name: otto-wg-briefing
    agent: otto
    cron: "0 10 * * 2"          # Tuesdays 10:00, the day before the Tech WG
    budget_usd: 1.00
    prompt: >
      Send Diana Lease, who chairs the Tech WG, the briefing for tomorrow's meeting, following
      "Tuesday" in your instructions.

  - name: otto-recordings
    agent: otto
    cron: "0 9 * * 4"           # Thursdays 09:00, the morning after the Tech WG
    budget_usd: 1.00
    prompt: >
      Process this week's Tech WG recording, following "Thursday" in your instructions.

  - name: sage-weekly-brief
    agent: sage
    cron: "0 7 * * 1"           # Mondays 07:00, before Otto picks the chair's news candidates at 09:00
    budget_usd: 1.00
    prompt: >
      Write this week's WG news brief, following "Standing work" in your instructions.

  # Phase 2+
  - name: rosa-community
    agent: rosa
    cron: "0 9,17 * * *"
    budget_usd: 0.75
    prompt: Welcome newcomers, answer questions, and check good-first-issue coverage.

  - name: juno-weekly
    agent: juno
    cron: "0 10 * * 3"
    budget_usd: 1.00
    prompt: Review docs gaps and draft this week's posts from recent work.

  # Phase 3
  - name: kit-weekly
    agent: kit
    cron: "0 10 * * 2"
    budget_usd: 2.00
    prompt: Check security posture and progress the training plan.

  # Felix has no schedule: in Phase 1 he works only on CI fixes the gateway starts for
  # PRs the network tracks (decision 63). No CI health sweeps, no releases.

  - name: nell-weekly
    agent: nell
    cron: "0 11 * * 4"
    budget_usd: 1.00
    prompt: Progress adopter, mentoring and funding pipelines.
