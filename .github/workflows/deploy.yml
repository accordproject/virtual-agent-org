name: deploy
# Manual only. Deploys agents to Claude Managed Agents, then the gateway to Cloudflare,
# and opens a PR with any new resource IDs.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would change without applying it
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # require owner approval in the repo's environment settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm ci --prefix gateway
      - run: npm test
      - name: Deploy agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_DEPLOY_KEY }}
          MIRA_GITHUB_TOKEN: ${{ secrets.MIRA_GITHUB_TOKEN }}
          VERA_GITHUB_TOKEN: ${{ secrets.VERA_GITHUB_TOKEN }}
          OTTO_GITHUB_TOKEN: ${{ secrets.OTTO_GITHUB_TOKEN }}
        run: npx tsx scripts/deploy.ts ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Deploy gateway
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm --prefix gateway run migrate && npm --prefix gateway run deploy
      - name: Propose updated resource IDs
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: deploy/resource-ids
          title: "Update deployed resource IDs"
          add-paths: gateway/src/generated/deployed.json
