name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm test
      - name: Generated config is up to date
        run: |
          npm run compile
          git diff --exit-code gateway/src/generated/network.json
