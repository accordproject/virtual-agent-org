name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm test
      - name: Generated config is up to date
        run: |
          npm run compile
          git diff --exit-code gateway/src/generated/network.json
      - name: Flag safety files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only "origin/$BASE_REF...HEAD" | npx tsx scripts/flag-safety.ts
