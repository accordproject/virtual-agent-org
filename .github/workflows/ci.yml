name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm test
      - name: Generated config is up to date
        run: |
          npm run compile
          git diff --exit-code gateway/src/generated/network.json
      # Runs the base branch's copy of the check, so a PR can't silence it by editing it.
      # Only the PR that first adds the script runs its own copy.
      - name: Flag safety files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          script="$RUNNER_TEMP/flag-safety.ts"
          if ! git show "origin/$BASE_REF:scripts/flag-safety.ts" > "$script" 2>/dev/null; then
            script=scripts/flag-safety.ts
          fi
          git diff --name-only "origin/$BASE_REF...HEAD" | npx tsx "$script"
