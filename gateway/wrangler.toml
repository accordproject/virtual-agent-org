name = "virtual-agent-org-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Deployed to the Accord Project Cloudflare account. Set account_id after `wrangler login`:
# account_id = "fe0bfc8fb9ecfbc441c6663f8eca680c"

[vars]
DRY_RUN = "false"   # set to "false" only after the Phase 0 gate passes

[[d1_databases]]
binding = "DB"
database_name = "virtual-agent-org1"
database_id = "b2991630-bd5e-419f-94e0-9c0ffb451d05"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]   # sweeper: re-process unfinished sessions in case a webhook was missed

# Secrets (set with `wrangler secret put <NAME>`, never committed):
# TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, OWNER_TELEGRAM_ID, TSC_TELEGRAM_IDS
# ANTHROPIC_API_KEY, ANTHROPIC_WEBHOOK_SECRET
# GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_INSTALLATION_ID
